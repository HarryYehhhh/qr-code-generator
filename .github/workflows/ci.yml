name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest tests/ -v

  frontend-build:
    name: Frontend build (vue-tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  auto-merge:
    name: Auto-merge claude/* PR
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.head_ref, 'claude/') ||
      startsWith(github.head_ref, 'feat/') ||
      startsWith(github.head_ref, 'fix/') ||
      startsWith(github.head_ref, 'docs/') ||
      startsWith(github.head_ref, 'style/') ||
      startsWith(github.head_ref, 'refactor/') ||
      startsWith(github.head_ref, 'perf/') ||
      startsWith(github.head_ref, 'test/') ||
      startsWith(github.head_ref, 'chore/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
